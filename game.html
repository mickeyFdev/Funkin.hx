<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funkin Game Shell</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#openfl-content{width:100%;height:100%}#hint{position:fixed;z-index:2;top:10px;left:10px;background:#111c;color:#fff;padding:8px 10px;border-radius:8px;font:12px system-ui}#hint a{color:#6ee7ff}</style></head>
<body><div id="hint">ゲーム本体を起動中 · <a href="index.html">編集画面へ戻る</a></div><div id="openfl-content"></div>
<script src="Funkin.js"></script>
<script>
// 添付された公式ゲームのHaxe/Limeバンドルを、標準のLime HTML embed方式で起動します。
window.addEventListener('load',function(){
  try {
    if(window.lime && typeof window.lime.embed==='function') window.lime.embed('Funkin','openfl-content',1280,720,{resizable:true});
    else document.getElementById('hint').textContent='Funkin.js のLime embed APIが見つかりません。';
  } catch(e) { document.getElementById('hint').textContent='起動エラー: '+e.message; console.error(e); }
});
</script></body></html>
