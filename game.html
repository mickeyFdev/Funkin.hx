<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Funkin Game Shell</title><style>html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#openfl-content{width:100%;height:100%}#hint{position:fixed;z-index:2;top:10px;left:10px;background:#111c;color:#fff;padding:8px 10px;border-radius:8px;font:12px system-ui}#hint a{color:#6ee7ff}</style></head>
<body><div id="hint">公式アセットを準備中… · <a href="index.html">編集画面へ戻る</a></div><div id="openfl-content"></div>
<script>
const hint = document.getElementById('hint');
function setHint(text){ hint.firstChild.textContent = text + ' '; }
function loadGameBundle(){
  const script = document.createElement('script');
  let bundleUrl = './Funkin.js';
  try {
    const saved = JSON.parse(localStorage.getItem('funkin-html-editor') || '{}');
    if (saved.bundleUrl && !saved.bundleUrl.includes('raw.githubusercontent.com/mickeyFdev/Funkin.hx')) bundleUrl = saved.bundleUrl;
  } catch (_) {}
  script.src = bundleUrl;
  script.onload = () => {
    try {
      if(window.lime && typeof window.lime.embed === 'function') {
        setHint('ゲームを起動中…');
        window.lime.embed('Funkin','openfl-content',1280,720,{resizable:true});
      } else setHint('Funkin.js のLime embed APIが見つかりません。');
    } catch(e) { setHint('起動エラー: ' + e.message); console.error(e); }
  };
  script.onerror = () => setHint('ゲーム本体JSをHTTPから読み込めません: ' + bundleUrl);
  document.body.appendChild(script);
}
(async function(){
  if (!('serviceWorker' in navigator)) { setHint('このブラウザはService Worker非対応です。'); loadGameBundle(); return; }
  try {
    const registration = await navigator.serviceWorker.register('./sw.js?v=5', {scope:'./'});
    await registration.update();
    await navigator.serviceWorker.ready;
    // 新規訪問時も確実に現在のページを制御させる。
    if (!navigator.serviceWorker.controller) {
      setHint('公式アセット経路を有効化しました。再読み込み中…');
      location.reload();
      return;
    }
    const saved = localStorage.getItem('funkin-html-editor');
    if (saved) {
      try {
        const config = JSON.parse(saved);
        if (config.modBase) navigator.serviceWorker.controller.postMessage({type:'set-mod-base', base:config.modBase});
      } catch (_) {}
    }
    setHint('公式アセットを準備済み。ゲームを読み込み中…');
    loadGameBundle();
  } catch(e) {
    setHint('アセット中継の準備に失敗: ' + e.message);
    console.error(e);
    loadGameBundle();
  }
})();
</script></body></html>
