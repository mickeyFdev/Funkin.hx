<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171827'/%3E%3Cpath d='M14 18h36v8H22v7h22v8H22v13h-8z' fill='%23ff4fa3'/%3E%3Ccircle cx='47' cy='47' r='6' fill='%2343d9ff'/%3E%3C/svg%3E"><title>Funkin Game Shell</title><style>@font-face{font-family:"Funkin VCR";src:url("https://cdn.jsdelivr.net/gh/FunkinCrew/funkin.assets@main/fonts/vcr-bold.ttf") format("truetype");font-display:swap;font-weight:700}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#openfl-content{width:100%;height:100%}#hint{position:fixed;z-index:2;top:10px;left:10px;background:#111c;color:#fff;padding:8px 10px;border-radius:8px;font:700 12px/1.5 "Funkin VCR",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em}#hint a{color:#6ee7ff}</style></head>
<body><div id="hint">公式アセットを準備中… · <a href="index.html">編集画面へ戻る</a></div><div id="openfl-content"></div>
<script>
const hint = document.getElementById('hint');
function setHint(text){ hint.firstChild.textContent = text + ' '; }
async function prepareGameFont(config){
  const engineFont = /^(psych|kade)$/.test(config.engine || '') && config.runtimeBase
    ? config.runtimeBase.replace(/\/$/,'') + '/assets/fonts/vcr.ttf'
    : (config.fontUrl || 'https://cdn.jsdelivr.net/gh/FunkinCrew/funkin.assets@main/fonts/vcr-bold.ttf');
  const url = engineFont;
  const name = (/^(psych|kade)$/.test(config.engine || '') ? 'Engine VCR' : (config.fontName || 'Funkin VCR')).replace(/[^\w -]/g,'').trim() || 'Funkin VCR';
  navigator.serviceWorker.controller?.postMessage({type:'set-font-url', url});
  const face = new FontFace(name, `url(${JSON.stringify(url)})`, {weight:'700', style:'normal'});
  try {
    await face.load();
    document.fonts.add(face);
    document.documentElement.style.setProperty('--game-font', `"${name}", system-ui, sans-serif`);
  } catch (e) {
    console.warn('ゲーム用HTTPフォントの先行読込に失敗:', e);
  }
}
function loadGameBundle(){
  const script = document.createElement('script');
  let bundleUrl = './Funkin.js';
  let projectName = 'Funkin';
  try {
    const saved = JSON.parse(localStorage.getItem('funkin-html-editor') || '{}');
    if (saved.bundleUrl && !saved.bundleUrl.includes('raw.githubusercontent.com/mickeyFdev/Funkin.hx')) bundleUrl = saved.bundleUrl;
    if (saved.engine === 'psych') projectName = 'PsychEngine';
  } catch (_) {}
  script.src = bundleUrl;
  script.onload = () => {
    try {
      if(window.lime && typeof window.lime.embed === 'function') {
        setHint('ゲームを起動中…');
        window.lime.embed(projectName,'openfl-content',1280,720,{resizable:true,parameters:{}});
      } else setHint('Funkin.js のLime embed APIが見つかりません。');
    } catch(e) { setHint('起動エラー: ' + e.message); console.error(e); }
  };
  script.onerror = () => setHint('ゲーム本体JSをHTTPから読み込めません: ' + bundleUrl);
  document.body.appendChild(script);
}
(async function(){
  if (!('serviceWorker' in navigator)) { setHint('このブラウザはService Worker非対応です。'); loadGameBundle(); return; }
  try {
    const registration = await navigator.serviceWorker.register('./sw.js?v=33', {scope:'./'});
    await registration.update();
    await navigator.serviceWorker.ready;
    // 新規訪問時も確実に現在のページを制御させる。
    if (!navigator.serviceWorker.controller) {
      setHint('公式アセット経路を有効化しました。再読み込み中…');
      location.reload();
      return;
    }
    let config = {};
    const saved = localStorage.getItem('funkin-html-editor');
    if (saved) {
      try {
        config = JSON.parse(saved);
        // 旧設定にも現在のPsych/Kadeフォント配信先を補完する。
        const runtimes = {
          psych: 'https://cdn.jsdelivr.net/gh/CrozeStudios/FOUNDATION-FNF-HTML5-Port@master/',
          kade: 'https://cdn.jsdelivr.net/gh/KadeArchive/Kade-Engine@stable/'
        };
        if (/^(psych|kade)$/.test(config.engine || '') && !config.runtimeBase) {
          config.runtimeBase = runtimes[config.engine];
        }
        if (config.modBase) navigator.serviceWorker.controller.postMessage({type:'set-mod-base', base:config.modBase});
        navigator.serviceWorker.controller.postMessage({type:'set-engine', engine:config.engine || 'official'});
        if (config.runtimeBase) navigator.serviceWorker.controller.postMessage({type:'set-runtime-base', base:config.runtimeBase});
      } catch (_) {}
    }
    await prepareGameFont(config);
    setHint('公式アセットを準備済み。ゲームを読み込み中…');
    loadGameBundle();
  } catch(e) {
    setHint('アセット中継の準備に失敗: ' + e.message);
    console.error(e);
    loadGameBundle();
  }
})();
</script></body></html>
