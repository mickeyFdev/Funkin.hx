<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23171827'/%3E%3Cpath d='M14 18h36v8H22v7h22v8H22v13h-8z' fill='%23ff4fa3'/%3E%3Ccircle cx='47' cy='47' r='6' fill='%2343d9ff'/%3E%3C/svg%3E"><title>Funkin Game Shell</title><style>@font-face{font-family:"Funkin VCR";src:url("./vcr-bold.ttf") format("truetype");font-display:swap;font-weight:700}html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}#openfl-content{width:100%;height:100%}#hint{position:fixed;z-index:2;top:10px;left:10px;background:#111c;color:#fff;padding:8px 10px;border-radius:8px;font:700 12px/1.5 "Funkin VCR",system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em}#hint a{color:#6ee7ff}</style></head>
<body><div id="hint">公式アセットを準備中…</div><div id="openfl-content"></div>
<script>
const hint = document.getElementById('hint');
function setHint(text){ hint.firstChild.textContent = text + ' '; }

// 100秒間操作がなければ、このゲーム画面を自動終了する。
// window.close() はブラウザ仕様上、scriptで開かれたタブでのみ成功するため、
// 通常のタブでは about:blank へ移動して画面を閉じた状態にする。
const IDLE_CLOSE_MS = 100000;
let idleTimer = 0;
let lastActivity = 0;
function closeIdlePage(){
  try { window.close(); } catch (_) {}
  setTimeout(() => {
    if (!document.hidden) {
      try { location.replace('about:blank'); } catch (_) {
        document.body.replaceChildren();
        document.body.style.background = '#000';
      }
    }
  }, 300);
}
function resetIdleClose(){
  const now = Date.now();
  if (now - lastActivity < 250) return;
  lastActivity = now;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(closeIdlePage, IDLE_CLOSE_MS);
}
['pointerdown','keydown','wheel','touchstart','mousemove'].forEach(type => {
  window.addEventListener(type, resetIdleClose, {passive:true});
});
resetIdleClose();

// Funkin.js の Lime/OpenFL はフォントを「名前」だけで参照し、@font-face は作らない。
// ページ側に同名の定義が無いとブラウザ標準のセリフ体になるため、VCR を同名で登録する。
async function registerGameFonts(){
  const V = './assets/fonts/vcr.ttf';
  const names = [
    'VCR OSD Mono','VCR OSD Mono Bold','VCR OSD Mono Italic','VCR OSD Mono Bold Italic',
    // 曲名(フリープレイ)・BOYFRIEND などが使う名前。未登録だとセリフ体になるので全部VCRにする
    '5by7','5by7 Bold','Consolas Italic','DS-Digital','DS-Digital Bold','DS-Digital Italic','DS-Digital Bold Italic',
    'Inconsolata Black','Inconsolata Bold','Inconsolata ExtraBold','Inconsolata ExtraLight','Inconsolata Medium',
    'Inconsolata Regular','Inconsolata SemiBold','Quantico','Quantico-Bold','Quantico-Italic','Quantico-BoldItalic',
    'Share Tech Mono','YoureGone-Regular','Nokia Cellphone FC Small','Monsterrat'
  ];
  const faces = names.map(n => [n, /Bold/i.test(n) && !/Italic/i.test(n) ? './assets/fonts/vcr-bold.ttf' : V]);
  const jobs = [];
  for (const [family, url] of faces) {
    for (const style of ['normal', 'italic']) {
      // Service Worker 経由(公式CDN)を優先し、取れなければ同梱の vcr-bold.ttf を使う
      const face = new FontFace(family, `url("${url}"), url("./vcr-bold.ttf")`, {weight:'100 900', style});
      jobs.push(face.load().then(f => { document.fonts.add(f); }, e => console.warn('VCRフォント登録失敗:', family, e)));
    }
  }
  await Promise.allSettled(jobs);
}
async function prepareGameFont(config){
  await registerGameFonts();
  const url = config.fontUrl || './vcr-bold.ttf';
  const name = (config.fontName || 'Funkin VCR').replace(/[^\w -]/g,'').trim() || 'Funkin VCR';
  navigator.serviceWorker.controller?.postMessage({type:'set-font-url', url});
  const face = new FontFace(name, `url(${JSON.stringify(url)})`, {weight:'700', style:'normal'});
  try {
    await face.load();
    document.fonts.add(face);
    document.documentElement.style.setProperty('--game-font', `"${name}", system-ui, sans-serif`);
  } catch (e) {
    console.warn('ゲーム用HTTPフォントの先行読込に失敗:', e);
  }
}
function loadGameBundle(){
  const script = document.createElement('script');
  // Keep the game bundle same-origin so this Service Worker can intercept manifests and assets.
  const bundleUrl = './Funkin.js';
  script.src = bundleUrl;
  script.onload = () => {
    try {
      const limeApi = window.lime || (window.exports && window.exports.lime);
      if(limeApi && typeof limeApi.embed === 'function') {
        window.lime = limeApi;
        setHint('ゲームを起動中…');
        limeApi.embed('Funkin','openfl-content',1280,720,{resizable:true});
      } else setHint('Funkin.js のLime embed APIが見つかりません。');
    } catch(e) { setHint('起動エラー: ' + e.message); console.error(e); }
  };
  script.onerror = () => setHint('ゲーム本体JSをHTTPから読み込めません: ' + bundleUrl);
  document.body.appendChild(script);
}
(async function(){
  if (!('serviceWorker' in navigator)) { setHint('このブラウザはService Worker非対応です。'); await registerGameFonts(); loadGameBundle(); return; }
  try {
    const registration = await navigator.serviceWorker.register('./sw.js?v=29', {scope:'./'});
    await registration.update();
    await navigator.serviceWorker.ready;
    // 新規訪問時も確実に現在のページを制御させる。
    if (!navigator.serviceWorker.controller) {
      setHint('公式アセット経路を有効化しました。再読み込み中…');
      location.reload();
      return;
    }
    let config = {};
    const saved = localStorage.getItem('funkin-html-editor');
    if (saved) {
      try {
        config = JSON.parse(saved);
        if (config.modBase) navigator.serviceWorker.controller.postMessage({type:'set-mod-base', base:config.modBase});
        navigator.serviceWorker.controller.postMessage({type:'set-engine', engine:config.engine || 'official'});
        if (config.runtimeBase) navigator.serviceWorker.controller.postMessage({type:'set-runtime-base', base:config.runtimeBase});
      } catch (_) {}
    }
    await prepareGameFont(config);
    setHint('公式アセットを準備済み。ゲームを読み込み中…');
    loadGameBundle();
  } catch(e) {
    setHint('アセット中継の準備に失敗: ' + e.message);
    console.error(e);
    await registerGameFonts();
    loadGameBundle();
  }
})();
</script></body></html>
